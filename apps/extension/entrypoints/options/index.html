<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>SchnellBuch options</title>
    <meta content="false" name="manifest.open_in_tab">
    <link href="./style.css" rel="stylesheet">
  </head>
  <body>
    <main>
      <h1>SchnellBuch</h1>
      <form id="settings" method="post">
        <label for="server">SchnellBuch address</label>
        <input
          autocomplete="url"
          id="server"
          name="server"
          placeholder="https://bookmarks.example.com"
          required
          type="text"
        >
        <p class="hint">
          Pages and links you save go here. Use your own address if you host
          SchnellBuch yourself.
        </p>
        <div class="row">
          <button type="submit">Save</button>
          <span aria-live="polite" id="status" role="status"></span>
        </div>
      </form>
      <section>
        <h2>Ways to save</h2>
        <ul>
          <li>Click the SchnellBuch button in the toolbar.</li>
          <li>
            Press <kbd id="shortcut">Alt+Shift+S</kbd>. Change it in your
            browser's extension shortcuts.
          </li>
          <li>Right-click any link → Save link to SchnellBuch.</li>
        </ul>
      </section>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
